# http-level rate-limit zones for the exam system (defence-in-depth at the edge).
# Install: sudo cp infra/nginx/ratelimit.conf /etc/nginx/conf.d/exam-ratelimit.conf
#
# Keyed by client IP. The app also rate-limits per-user/per-IP in Redis; this stops abusive
# traffic before it ever reaches the containers.

# ~5 login attempts/sec/IP sustained (burst handled in host.conf). 10m ≈ 160k unique IPs.
limit_req_zone $binary_remote_addr zone=exam_login:10m rate=5r/s;

# ~30 requests/sec/IP sustained for normal browsing/API use.
limit_req_zone $binary_remote_addr zone=exam_general:10m rate=30r/s;

# Return 429 (not the default 503) when a client exceeds its rate.
limit_req_status 429;
