# ─────────────────────────────────────────────────────────────────────────────
# Host-level nginx for the VPS — the public edge / reverse proxy / TLS terminator.
#
# Install:
#   sudo cp infra/nginx/ratelimit.conf /etc/nginx/conf.d/exam-ratelimit.conf
#   sudo cp infra/nginx/host.conf     /etc/nginx/sites-available/exam-system
#   sudo ln -sf /etc/nginx/sites-available/exam-system /etc/nginx/sites-enabled/exam-system
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d e-exam.ru.ac.bd     # provisions + auto-renews the certificate
#
# Public traffic:  Internet ──443/TLS──▶ this nginx ──▶ 127.0.0.1:8080 (web container)
# Security headers + CSP are set by the app (web container nginx + Helmet), so they are not
# duplicated here; this layer handles TLS, gzip, rate-limiting and upload limits.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name e-exam.ru.ac.bd;

    # Let certbot answer ACME challenges over HTTP; redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name e-exam.ru.ac.bd;

    # ── TLS (managed by certbot; these paths are created by `certbot --nginx`) ──
    ssl_certificate     /etc/letsencrypt/live/e-exam.ru.ac.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-exam.ru.ac.bd/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads: student/teacher/course xlsx imports. 50M is generous; raise if needed.
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Login / 2FA: strict per-IP rate limit at the edge (defence-in-depth on top of the
    #    app's Redis throttler). burst absorbs quick retries; nodelay rejects the rest fast. ──
    location ~ ^/api/v1/auth/(login|2fa) {
        limit_req zone=exam_login burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        include            /etc/nginx/snippets/exam-proxy.conf;
    }

    # ── Everything else (SPA + API). The web container serves the SPA and proxies /api → api. ──
    location / {
        limit_req zone=exam_general burst=100 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        include            /etc/nginx/snippets/exam-proxy.conf;
    }
}
