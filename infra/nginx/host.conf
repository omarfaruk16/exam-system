# Host-level nginx config for the VPS.
# Place at /etc/nginx/sites-available/exam-system and symlink to sites-enabled/.
# Run certbot after to auto-insert the SSL block.

server {
    listen 80;
    server_name e-exam.ru.ac.bd;

    # Let certbot handle ACME challenges; redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name e-exam.ru.ac.bd;

    # Managed by certbot:
    ssl_certificate     /etc/letsencrypt/live/e-exam.ru.ac.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-exam.ru.ac.bd/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
