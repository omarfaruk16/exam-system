# Preserve the scheme the *edge* proxy saw. Behind the host nginx this is "https"; if the
# container is hit directly over http (local dev), fall back to its own scheme. Without this,
# the API sees "http", thinks the connection is insecure, and (with COOKIE_SECURE=true) never
# sets the session cookie — so login appears to work but every authenticated call then fails.
map $http_x_forwarded_proto $exam_fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers (browser-facing; the API sets the same via Helmet for defence in depth) ──
  # style-src allows 'unsafe-inline' because Tailwind/utility styles inject inline; img-src allows
  # data: for the 2FA QR code. Everything else is same-origin only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Same-origin API proxy → the API container (so session cookies stay first-party).
  location /api/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $exam_fwd_proto;
  }

  # SPA fallback — client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
