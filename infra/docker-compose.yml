name: exam-system

# Local development infrastructure.
#   pnpm infra:up   -> starts postgres + redis (what dev needs)
#   docker compose --profile pgbouncer up -d   -> also starts PgBouncer (prod-parity pooling)
#
# The API connects DIRECTLY to Postgres in local dev (simple + reliable). In production,
# point DATABASE_URL at PgBouncer (port 6432, transaction pooling, ?pgbouncer=true) and keep
# DIRECT_URL on 5432 for Prisma Migrate. See docs/README.md → Database.

services:
  postgres:
    image: postgres:17-alpine
    container_name: exam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-exam}
    ports:
      # Host 5433 (5432 is commonly taken by other local Postgres instances); container stays 5432.
      - '${POSTGRES_PORT:-5436}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-exam} -d ${POSTGRES_DB:-exam}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: exam_redis
    restart: unless-stopped
    # appendonly so sessions/queues survive a restart; noeviction so we never silently drop jobs.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: exam_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-exam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-exam_dev_password}
      DB_NAME: ${POSTGRES_DB:-exam}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      LISTEN_PORT: 6432
    ports:
      - '${PGBOUNCER_PORT:-6432}:6432'
    profiles: ['pgbouncer', 'full']

  # ─── The application itself (NestJS API + embedded workers, and the nginx-served SPA) ───
  #   docker compose --profile app up -d --build
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: exam_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4100
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam_dev_password}@postgres:5432/${POSTGRES_DB:-exam}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam_dev_password}@postgres:5432/${POSTGRES_DB:-exam}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev_only_session_secret_change_me_please_0123456789abcdef}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      WEB_APP_URL: http://localhost:${WEB_PORT:-8080}
      COOKIE_SECURE: 'false'
      INSTITUTION_NAME: University of Rajshahi
      BRAND_PRIMARY: '#1E3A5F'
      STORAGE_DIR: /app/apps/api/storage
      LOG_LEVEL: info
    volumes:
      - apistorage:/app/apps/api/storage
    profiles: ['app', 'full']

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    container_name: exam_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    profiles: ['app', 'full']

volumes:
  pgdata:
  redisdata:
  apistorage:
